global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Traefik (metrics on its internal port 8080, which is not published on the host)
  - job_name: 'traefik'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['traefik:8080']
        labels:
          application: 'traefik'

  # Gitea
  - job_name: 'gitea'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['gitea:3000']
        labels:
          application: 'gitea'
