services:
  # Prometheus: scrapes the services over "acciona"
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - acciona
    labels:
      # Enable Traefik
      - "traefik.enable=true"

      # Router
      - "traefik.http.routers.prometheus.rule=Host(`${PROMETHEUS_HOSTNAME:?set PROMETHEUS_HOSTNAME in .env}`)"
      - "traefik.http.routers.prometheus.entrypoints=web"

      # Service
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # Grafana: dashboards over Prometheus
  grafana:
    image: grafana/grafana:13.2.7
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?set GF_SECURITY_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - acciona
    labels:
      # Enable Traefik
      - "traefik.enable=true"

      # Router
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOSTNAME:?set GRAFANA_HOSTNAME in .env}`)"
      - "traefik.http.routers.grafana.entrypoints=web"

      # Service
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

volumes:
  prometheus_data:
  grafana_data:

networks:
  acciona:
    external: true
