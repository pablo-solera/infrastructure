services:
  web:
    image: pablosla/work-from-home-web:latest
    container_name: work-from-home-web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_CONNECT_STRING: ${ORACLE_CONNECT_STRING}
      ORACLE_TIMERTASK_SCHEMA: ${ORACLE_TIMERTASK_SCHEMA}
      ORACLE_STAFF_LINE_IDS: ${ORACLE_STAFF_LINE_IDS}
      INTEGRATION_LDAP_URL: ${INTEGRATION_LDAP_URL}
      INTEGRATION_LDAP_ACCESSACCOUNT_UPN: ${INTEGRATION_LDAP_ACCESSACCOUNT_UPN}
      INTEGRATION_LDAP_ACCESSACCOUNT_PWD: ${INTEGRATION_LDAP_ACCESSACCOUNT_PWD}
      INTEGRATION_LDAP_USER_BASESEARCHGROUP: ${INTEGRATION_LDAP_USER_BASESEARCHGROUP}
    depends_on:
      - postgres
    networks:
      - acciona
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wfh.rule=Host(`${TRAEFIK_HOSTNAME}`)"
      - "traefik.http.routers.wfh.entrypoints=web"
      - "traefik.http.services.wfh.loadbalancer.server.port=3000"

  postgres:
    image: postgres:18.3
    container_name: work-from-home-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - default

volumes:
  postgres_data:

networks:
  acciona:
    external: true
