# Work-from-home web with its own dedicated PostgreSQL and the wfh-watcher Telegram bot.
#
# Settings: the web loads .env (env_file) and overrides here, in "environment", only what depends on this stack: the
# database URL, the mail defaults and a fixed Oracle client path. .env is also what Compose reads to fill the ${...}
# placeholders of this file.

services:
  # Work-from-home web (Next.js) behind Traefik
  web:
    image: pablosla/work-from-home-web:2.11.2
    container_name: work-from-home-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@wfh-db:5432/${POSTGRES_DB}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-10.33.144.238}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-teletrabajo@audatex.es}
      ORACLE_ADMIN_GROUP_ID: ${ORACLE_ADMIN_GROUP_ID:-1024}
      ORACLE_COORDINATOR_GROUP_ID: ${ORACLE_COORDINATOR_GROUP_ID:-1017}
      ORG_SNAPSHOT_TTL_SECONDS: ${ORG_SNAPSHOT_TTL_SECONDS:-60}
      # Provided by the image. Fixed here so an empty value in .env can never override it and break the Oracle client.
      ORACLE_CLIENT_LIB_DIR: /opt/oracle/instantclient
    depends_on:
      wfh-db:
        condition: service_healthy
    networks:
      - default
      - acciona
    labels:
      # Enable Traefik
      - "traefik.enable=true"

      # Router
      - "traefik.http.routers.wfh.rule=Host(`${TRAEFIK_HOSTNAME:?set TRAEFIK_HOSTNAME in .env}`)"
      - "traefik.http.routers.wfh.entrypoints=web"

      # Service
      - "traefik.http.services.wfh.loadbalancer.server.port=3000"

  # PostgreSQL dedicated to the web (private network only). Named "wfh-db" so no name clashes on "acciona".
  wfh-db:
    image: postgres:18.7
    container_name: work-from-home-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Telegram bot that reports changes to a person's work-from-home days
  wfh-watcher:
    image: pablosla/wfh-watcher:v1.0.0
    container_name: wfh-watcher
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@wfh-db:5432/${POSTGRES_DB}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TARGET_ORACLE_EMP_ID: ${WATCHER_TARGET_ORACLE_EMP_ID:-44}
      TARGET_NAME: ${WATCHER_TARGET_NAME:-Ignacio Vera}
    volumes:
      - wfh_watcher_data:/app/data
    depends_on:
      wfh-db:
        condition: service_healthy

volumes:
  postgres_data:
  wfh_watcher_data:

networks:
  acciona:
    external: true
