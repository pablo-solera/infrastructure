services:
  # Nexus: UI and API through Traefik, the Docker registries on host ports
  nexus:
    image: sonatype/nexus3:3.98.3
    container_name: nexus
    restart: unless-stopped
    environment:
      # JVM memory settings - adjust based on available RAM
      INSTALL4J_ADD_VM_PARAMS: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=2g"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - nexus_data:/nexus-data
    ports:
      - "8082:8082"   # Docker hosted registry
      - "8083:8083"   # Docker proxy registry
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - acciona
    labels:
      # Enable Traefik
      - "traefik.enable=true"

      # Router
      - "traefik.http.routers.nexus.rule=Host(`${TRAEFIK_HOSTNAME:?set TRAEFIK_HOSTNAME in .env}`)"
      - "traefik.http.routers.nexus.entrypoints=web"

      # Service
      - "traefik.http.services.nexus.loadbalancer.server.port=8081"

volumes:
  nexus_data:

networks:
  acciona:
    external: true
