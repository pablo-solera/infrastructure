services:
  gitea:
    image: docker.gitea.com/gitea:1.26
    container_name: gitea
    environment:
      - USER_UID=${USER_UID}
      - USER_GID=${USER_GID}
      - GITEA__database__DB_TYPE=${GITEA_DATABASE_TYPE}
      - GITEA__database__HOST=${GITEA_DATABASE_HOST}
      - GITEA__database__NAME=${GITEA_DATABASE_NAME}
      - GITEA__database__USER=${GITEA_DATABASE_USER}
      - GITEA__database__PASSWD=${GITEA_DATABASE_PASSWORD}
      - GITEA__service__DISABLE_REGISTRATION=${GITEA_SERVICE_DISABLE_REGISTRATION}
      - GITEA__repository__DEFAULT_BRANCH=${GITEA_REPOSITORY_DEFAULT_BRANCH}
      - GITEA__metrics__ENABLED=${GITEA_METRICS_ENABLED}
      - GITEA__metrics__ENABLED_ISSUE_BY_LABEL=${GITEA_ENABLED_ISSUE_BY_LABEL}
      - GITEA__metrics__ENABLED_ISSUE_BY_REPOSITORY=${GITEA_ENABLED_ISSUE_BY_REPOSITORY}
      - GITEA__migrations__ALLOW_LOCALNETWORKS=${GITEA_MIGRATIONS_ALLOW_LOCALNETWORKS}
    restart: unless-stopped
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "222:22"
    depends_on:
      - postgres
    networks:
      - acciona
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`${TRAEFIK_HOSTNAME}`)"
      - "traefik.http.routers.gitea.entrypoints=web"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"

  postgres:
    container_name: code-repository-postgres
    image: postgres:18.3
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - default
  gitea-runner:
    container_name: runner-1
    image: gitea/act_runner
    restart: unless-stopped
    depends_on:
      - gitea
    volumes:
      - gitea_runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GITEA_INSTANCE_URL=${GITEA_INSTANCE_URL}
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN}
    networks:
      - acciona

volumes:
  postgres_data:
  gitea_runner_data:
  gitea_data:

networks:
  acciona:
    external: true
