# Request extraction web with its own dedicated PostgreSQL. The readers and transformers live in ../etl-server; the web
# reaches them by service name over the external "acciona" network (bmw-reader-api, bmw-transformer-api,
# renault-reader-api), so start etl-server first.
#
# Image versions are written in each "image:" line (the version of the web's package.json); update them there on a release.
#
# Settings: the web loads .env (env_file) and overrides here, in "environment", only what depends on this stack: the
# database URL, the public address, the internal addresses of the readers and a fixed Oracle client path. The language and
# the S3 of the extractions belong to the readers (../etl-server), not to the web. .env is also what Compose reads to
# fill the ${...} placeholders of this file.
#
# The site is served over plain HTTP through Traefik, hence SESSION_COOKIE_SECURE=false in .env.

services:
  # PostgreSQL dedicated to the web (private network only). Named "request-extraction-db" so no name clashes on "acciona".
  request-extraction-db:
    image: postgres:18.7
    container_name: request-extraction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: sets the database up and exits (the web only starts after it succeeds). It applies the migrations and, when the
  # test accounts are enabled, creates their users: without a row in "users" a test account cannot sign in. It does not use Oracle.
  migrate:
    image: pablosla/request-extraction-web-migrate:2.0.0
    container_name: request-extraction-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@request-extraction-db:5432/${POSTGRES_DB}
      TEST_ACCOUNTS_ENABLED: ${TEST_ACCOUNTS_ENABLED:-false}
      TEST_ACCOUNTS_PASSWORD: ${TEST_ACCOUNTS_PASSWORD:-}
      TEST_ACCOUNT_ADMIN: ${TEST_ACCOUNT_ADMIN:-}
      TEST_ACCOUNT_COORDINATOR: ${TEST_ACCOUNT_COORDINATOR:-}
      TEST_ACCOUNT_EMPLOYEE: ${TEST_ACCOUNT_EMPLOYEE:-}
    depends_on:
      request-extraction-db:
        condition: service_healthy

  # Request extraction web (Next.js) behind Traefik
  web:
    image: pablosla/request-extraction-web:2.0.0
    container_name: request-extraction-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@request-extraction-db:5432/${POSTGRES_DB}
      # Public address used for the links in emails, from the host name Traefik serves.
      APP_BASE_URL: http://${TRAEFIK_HOSTNAME:?set TRAEFIK_HOSTNAME in .env}
      # Readers and transformer, by service name on the shared network.
      BMW_READER_BASE_URL: http://bmw-reader-api:3004
      BMW_TRANSFORMER_BASE_URL: http://bmw-transformer-api:3005
      RENAULT_READER_BASE_URL: http://renault-reader-api:3000
      # Provided by the image. Fixed here so an empty value in .env can never override it and break the Oracle client.
      ORACLE_CLIENT_LIB_DIR: /opt/oracle/instantclient
    depends_on:
      request-extraction-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - acciona
    labels:
      # Enable Traefik
      - "traefik.enable=true"

      # Router
      - "traefik.http.routers.request-extraction.rule=Host(`${TRAEFIK_HOSTNAME:?set TRAEFIK_HOSTNAME in .env}`)"
      - "traefik.http.routers.request-extraction.entrypoints=web"

      # Service
      - "traefik.http.services.request-extraction.loadbalancer.server.port=3000"

  # Calls the reconciliation endpoint every minute with the web image itself (Node's fetch), so requests, loads and email
  # retries keep moving even when nobody has the history page open. It uses this project's private network.
  reconcile:
    image: pablosla/request-extraction-web:2.0.0
    container_name: request-extraction-reconcile
    restart: unless-stopped
    environment:
      RECONCILE_SECRET: ${RECONCILE_SECRET:?set RECONCILE_SECRET in .env}
    command:
      - node
      - -e
      - |
        const url = "http://request-extraction-web:3000/api/internal/reconcile";
        const run = async () => {
          try {
            const response = await fetch(url, { method: "POST", headers: { authorization: "Bearer " + process.env.RECONCILE_SECRET }, signal: AbortSignal.timeout(55000) });
            if (!response.ok) console.error("reconcile answered", response.status);
          } catch (error) { console.error("reconcile failed:", error.message); }
        };
        run();
        setInterval(run, 60000);
    depends_on:
      - web

volumes:
  postgres_data:

networks:
  acciona:
    external: true
